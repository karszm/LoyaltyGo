# Konfiguracja serwowania panelu. Ten sam plik działa lokalnie w kontenerze i na Hetznerze —
# jedna kopia, więc konfiguracja produkcyjna nie może rozjechać się z tą, którą testujesz.
#
# Lokalnie:  docker run -p 3000:80 -v ./dist:/usr/share/nginx/html:ro \
#                       -v ./nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
# Na serwerze: skopiuj bloki `location` do /etc/nginx/sites-available/app.loyaltygo.pl
#            (docs/deploy-hetzner.md §4); `server_name` i TLS dokłada tam certbot.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — NAJWAŻNIEJSZA linia w tym pliku.
    #
    # Panel używa BrowserRouter, a link logujący z maila ląduje na /auth?returnTo=…, czyli na
    # ścieżce, pod którą nie ma żadnego pliku. Bez tego przepisania nginx zwraca 404 i
    # logowanie nie działa w ogóle — nie „czasem", tylko zawsze, dla każdego merchanta.
    # To samo dotyczy odświeżenia strony na /karta czy /klienci.
    location / {
        try_files $uri /index.html;
    }

    # Zasoby z hashem w nazwie (Vite) są niezmienne — może je cache'ować na rok.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NIE może być cache'owany: to on wskazuje na aktualne hashe assetów, więc
    # zacache'owany przez przeglądarkę pokazuje starą wersję panelu po każdym wdrożeniu.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
