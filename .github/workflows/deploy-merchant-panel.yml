name: Deploy merchant_panel

on:
  push:
    branches: [main]
    paths:
      - "merchant_panel/**"
      - ".github/workflows/deploy-merchant-panel.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci

      - name: Build
        working-directory: merchant_panel
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Known hosts
        run: ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: rsync to server
        run: |
          rsync -avz --delete merchant_panel/dist/ \
            deploy@${{ secrets.HETZNER_HOST }}:/var/www/loyaltygo-panel/
