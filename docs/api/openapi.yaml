openapi: 3.0.3
info:
  title: LoyaltyGo API
  version: 1.0.0-draft
  description: |
    Kontrakty API platformy lojalnościowej LoyaltyGo (v1).

    Źródłem wymagań są specyfikacje Gherkin w `docs/specs/*.feature`.
    Backend: Supabase (Postgres + Auth + Edge Functions). Wystawca kart: passkit.com.
    Źródłem prawdy o punktach, członkostwach i ofertach jest backend LoyaltyGo —
    karta w portfelu jest wyłącznie odzwierciedleniem stanu.

    ## Obszary API
    - **Public** — onboarding klienta i odzyskiwanie karty; bez uwierzytelnienia, rate-limitowane.
      Konsumowane przez dedykowany landing page programu hostowany w aplikacji
      panelu merchanta (publiczna trasa, np. `https://app.loyaltygo.pl/{inviteCode}`) —
      statyczny QR zaproszenia przekierowuje właśnie tam.
    - **SDK** — operacje SoftPOS (skan karty, rejestracja transakcji, anulowanie);
      uwierzytelnianie kluczem programu merchanta (`X-Program-Key`).
    - **Panel** — panel merchanta; uwierzytelnianie tokenem JWT Supabase Auth
      (passwordless magic link / OTP / Apple / Google). Merchant widzi wyłącznie własny program (RLS).
    - **Operator** — utrzymanie platformy (rozbieżności kart, RODO).

    ## Implementacja PoC — podział kontraktu
    Decyzja 2026-08-13: PoC realizuje kontrakt hybrydowo.

    - **`/sdk` i `/public` — kontrakt WIĄŻĄCY 1:1**, implementowany jako
      Supabase Edge Functions (konsumenci zewnętrzni: SDK iOS i landing
      programu). Operacje wymagają logiki serwerowej: uwierzytelnianie kluczem
      programu, atomowa konsumpcja kuponów (funkcja plpgsql w jednej transakcji
      DB), wysyłka e-maili, wywołania PassKit, rate limiting.
    - **`/panel` — kontrakt LOGICZNY**: odczyty i proste zapisy (program,
      klienci, oferty, transakcje, sync-rejections, block/unblock) panel SPA
      wykonuje bezpośrednio przez supabase-js (PostgREST) z izolacją przez RLS
      (`merchant_id` z JWT). Wyjątki wymagające Edge Functions: **publikacja
      programu** (sekrety PassKit), **pobranie/rotacja klucza programu**
      (generowanie i unieważnianie), **zamknięcie/zawieszenie** (przejścia
      stanów). Sekcja `/panel` opisuje więc semantykę (co jest możliwe, kto co
      widzi), nie literalne endpointy HTTP.
    - **`/ops`** — poza PoC (operacje operatora robione ręcznie w Supabase
      Studio); kontrakt zostaje jako docelowy.

    Edge Functions z service role omijają RLS — autoryzację (zakres merchanta
    wyprowadzony z klucza programu / invite code) egzekwują same. Sekrety
    (PassKit API key, pepper kluczy programu) żyją wyłącznie w Edge Functions.

    ## Zasady przekrojowe
    - Kwoty w PLN jako string dziesiętny (`"250.00"`), zawsze > 0.
    - Punkty: `kwota × przelicznik`, zaokrąglenie w dół do pełnego punktu.
      Obowiązuje przelicznik z chwili **wykonania** transakcji (`performed_at`), nie synchronizacji.
    - Idempotencja rejestracji transakcji: `transaction_id` nadany przez SoftPOS,
      unikalny w zakresie jednego merchanta. Wewnętrzny identyfikator LoyaltyGo to UUID.
    - Kupony konsumowane jednofazowo i atomowo w rejestracji transakcji; wskazanie
      kuponu przy skanie niczego nie zużywa. Niedostępny kupon nie blokuje transakcji
      (ostrzeżenie), z wyjątkiem walidacji wielu kuponów naraz (wszystko albo nic).
    - Endpointy publiczne nie ujawniają istnienia konta/członkostwa (enumeration-safe).

    ## Odpowiedzi przekrojowe
    Każda operacja pod tagami `SDK`, `Public` i `Panel` — niezależnie od tego, czy
    wymieniono to niżej przy operacji — może dodatkowo zwrócić:
    - **`405 method_not_allowed`** — metoda HTTP nieobsługiwana na danej ścieżce
      (`{ error: { code: method_not_allowed, message: "Metoda niedozwolona." } }`).
    - **`500 internal_error`** — nieoczekiwany błąd serwera
      (`{ error: { code: internal_error, message: "Wystąpił błąd serwera." } }`).

    Obie odpowiedzi mają kształt `Error` i nie są powtarzane przy każdej z ~20
    operacji tych trzech tagów — trzy Edge Functions (`sdk-api`, `public-api`,
    `panel-api`) zwracają je identycznie dla każdej trasy na poziomie routera.
  contact:
    email: kontakt@loyaltygo.example

servers:
  - url: https://api.loyaltygo.example/v1
    description: Produkcja (placeholder)

tags:
  - name: Public
    description: Onboarding klienta i odzyskiwanie karty (bez uwierzytelnienia). PoC — Edge Functions, kontrakt wiążący 1:1.
  - name: SDK
    description: Operacje SoftPOS przez SDK iOS (klucz programu). PoC — Edge Functions, kontrakt wiążący 1:1.
  - name: Panel
    description: Panel merchanta (JWT Supabase). PoC — supabase-js + RLS (kontrakt logiczny); Edge Functions tylko dla publish, klucza programu i przejść stanów.
  - name: Operator
    description: Utrzymanie platformy. Poza PoC (ręcznie w Supabase Studio) — kontrakt docelowy.

security: []

paths:
  # ==================================================================
  # PUBLIC — onboarding i odzyskiwanie karty
  # ==================================================================

  /public/invites/{inviteCode}:
    get:
      tags: [Public]
      operationId: getInvite
      summary: Dane programu dla landing page'a zaproszenia
      description: |
        Zwraca publiczne dane programu (branding) dla dedykowanego landing page'a
        programu w aplikacji panelu merchanta — to na niego przekierowuje
        zeskanowany QR zaproszenia. Strona renderuje branding merchanta,
        formularz dołączenia i przycisk "Dodaj do Apple Wallet" / "Dodaj do
        Google Wallet" po wydaniu karty.
        Program nieopublikowany, zawieszony lub zamknięty zwraca status —
        strona pokazuje odpowiedni komunikat i nie zbiera danych osobowych.
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Publiczne dane programu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProgram'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/invites/{inviteCode}/join:
    post:
      tags: [Public]
      operationId: joinProgram
      summary: Dołączenie klienta do programu
      description: |
        Tworzy członkostwo i zleca wystawienie karty u dostawcy passów.
        Dwukrotne zatwierdzenie formularza tworzy dokładnie jedno członkostwo.

        **Nowy adres e-mail** → 201: członkostwo powstaje, karta wraca od razu
        w odpowiedzi (przycisk "Dodaj do Apple/Google Wallet").

        **Adres z istniejącym członkostwem** → 202: karta i saldo NIGDY nie
        wracają w odpowiedzi (formularz nie weryfikuje własności adresu —
        bezpośredni zwrot karty pozwalałby przejąć cudzą kartę i punkty).
        Backend wysyła na ten adres wiadomość z linkiem do karty (mechanizm
        jak w `card-recovery`, token 24 h), a odpowiedź zawiera wyłącznie
        niezobowiązujący komunikat „być może": *"Jeżeli ten adres należy do
        programu u tego merchanta, karta pojawi się w Twojej skrzynce e-mail."*
        Dane osobowe istniejącego członka NIE są aktualizowane (zmiana danych
        wymagałaby zweryfikowanej ścieżki — poza v1). Odpowiedź nie zawiera
        `membership_id` ani salda.

        Przy awarii wystawcy kart członkostwo powstaje, a odpowiedź ma
        `pass.status = "preparing"` — link do karty dojdzie e-mailem po udanym
        wydaniu (kolejka ponowień).

        Przekroczenie limitu wysyłki e-maili dla tego adresu daje dokładnie to samo
        `202` „być może" — wiadomość po prostu nie zostaje wysłana, bez odrębnego
        statusu, żeby limit nie ujawniał istnienia członkostwa.
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '201':
          description: Nowe członkostwo utworzone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
        '202':
          description: |
            Adres ma już członkostwo w tym programie — karta nie wraca
            w odpowiedzi; link do karty wysłany e-mailem, komunikat „być może"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaybeEmailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Program niedostępny (nieopublikowany, zawieszony lub zamknięty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                suspended:
                  value: { error: { code: program_unavailable, message: "Program jest chwilowo niedostępny." } }
                closed:
                  value: { error: { code: program_closed, message: "Program został zakończony." } }
        '422':
          description: Błąd walidacji (niepoprawny e-mail, brak zgody RODO, brakujące pola)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /public/invites/{inviteCode}/card-recovery:
    post:
      tags: [Public]
      operationId: recoverCard
      summary: Odzyskanie karty (nowy telefon / karta usunięta z portfela)
      description: |
        Wysyła na podany adres e-mail link do karty w programie, którego dotyczy
        zaproszenie — i wyłącznie tego programu. Odpowiedź jest zawsze taka sama
        (202) z komunikatem „być może", niezależnie od tego, czy członkostwo
        istnieje — brak enumeracji kont: *"Jeżeli ten adres należy do programu
        u tego merchanta, karta pojawi się w Twojej skrzynce e-mail."*
        Link ważny 24 godziny. Gdy karta nie została jeszcze wydana (awaria
        wystawcy), wiadomość zostanie wysłana po udanym wydaniu.

        Przekroczenie limitu wysyłki e-maili dla tego adresu daje dokładnie to samo
        `202` „być może" — wiadomość po prostu nie zostaje wysłana, bez odrębnego
        statusu, żeby limit nie ujawniał istnienia członkostwa.
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: karol@example.com
      responses:
        '202':
          description: Zawsze ta sama odpowiedź — komunikat „być może"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaybeEmailResponse'
        '409':
          description: Program zawieszony lub zamknięty — link nie jest wysyłany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /public/card-links/{recoveryToken}:
    get:
      tags: [Public]
      operationId: getCardLink
      summary: Pobranie karty z linku odzyskiwania
      description: |
        Zwraca linki do dodania karty do portfela (Apple / Google). Link można
        otworzyć na wielu telefonach — wszystkie egzemplarze wskazują jedno
        członkostwo. Nie wymaga podania danych osobowych.
      parameters:
        - name: recoveryToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Karta gotowa do dodania
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassLinks'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Link wygasł (ponad 24 h) — odzyskiwanie trzeba uruchomić ponownie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: link_expired, message: "Link wygasł. Uruchom odzyskiwanie karty ponownie." }

  # ==================================================================
  # SDK — operacje SoftPOS (klucz programu)
  # ==================================================================

  /sdk/program:
    get:
      tags: [SDK]
      operationId: sdkGetProgram
      summary: Stan programu i link zaproszenia
      description: |
        Zwraca status programu oraz statyczny link/QR zaproszenia do wyświetlenia
        na SoftPOS. Program nieopublikowany → `status` inny niż `published`,
        SDK nie pokazuje QR.
      security:
        - programKey: []
      responses:
        '200':
          description: Stan programu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SdkProgram'
        '401':
          $ref: '#/components/responses/UnauthorizedProgramKey'

  /sdk/scans:
    post:
      tags: [SDK]
      operationId: sdkScanCard
      summary: Skan karty lojalnościowej klienta
      description: |
        QR na karcie w portfelu koduje `card_token` — stały, nieprzewidywalny
        (opaque) identyfikator członkostwa nadany przez backend przy wydaniu
        karty. Wszystkie egzemplarze karty tego samego członkostwa (stary
        telefon, ponowne wydanie) kodują ten sam `card_token`. To ten sam
        identyfikator, który SDK odczytuje lokalnie w trybie offline.

        Endpoint rozpoznaje kod i zwraca członka, saldo i listę dostępnych
        ofert oraz `scan_token` — kontekst ważny **10 minut**, wymagany do
        rejestracji transakcji online.

        (QR zaproszenia to co innego — statyczny URL landing page'a programu
        `app.loyaltygo.pl/{inviteCode}`, wyświetlany na SoftPOS lub wydruku,
        skanowany aparatem telefonu klienta, nie przez SDK.)

        Karta innego merchanta → 404 `card_foreign_program`, bez żadnych danych
        klienta. Kod nieczytelny / niebędący kartą → 422 `card_unrecognized`.
        Członek zablokowany → 200 ze statusem `blocked`, bez ofert; rejestracja
        transakcji i konsumpcja kuponów będą odrzucone.

        Starszy egzemplarz karty tego samego członkostwa (np. karta z poprzedniego
        telefonu) rozpoznawany jest jako to samo członkostwo i to samo saldo.
      security:
        - programKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_token]
              properties:
                card_token:
                  type: string
                  description: |
                    Zawartość zeskanowanego QR z karty Wallet — opaque
                    identyfikator członkostwa (ID karty lojalnościowej)
      responses:
        '200':
          description: Członek rozpoznany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '401':
          $ref: '#/components/responses/UnauthorizedProgramKey'
        '404':
          description: Karta spoza tego programu — żadne dane klienta nie są ujawniane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: card_foreign_program, message: "Karta spoza tego programu." }
        '409':
          $ref: '#/components/responses/ProgramNotActive'
        '422':
          description: Kod nieczytelny lub niebędący kartą lojalnościową
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: card_unrecognized, message: "Nie rozpoznano kodu. Spróbuj ponownie." }

  /sdk/transactions:
    post:
      tags: [SDK]
      operationId: sdkRegisterTransaction
      summary: Rejestracja transakcji (registerTransaction)
      description: |
        Nalicza punkty i (opcjonalnie) atomowo konsumuje kupony.

        **Identyfikacja członka** — dokładnie jedno z:
        - `scan_token` — ścieżka online; ważny 10 minut od skanu (po tym czasie
          409 `scan_context_expired`).
        - `card_token` — ścieżka synchronizacji offline; identyfikator karty
          odczytany lokalnie przez SDK. Wymaga `performed_at`. Kupony niedozwolone
          (`coupon_ids` → 422 `coupons_not_allowed_offline`).

        **Idempotencja** — `transaction_id` (nadany przez SoftPOS) jest kluczem
        idempotencji w zakresie merchanta. Powtórzenie zwraca wynik pierwotnej
        rejestracji (200, `idempotent_replay: true`), z tym samym wewnętrznym UUID
        i informacją o zrealizowanych wtedy kuponach. Ten sam `transaction_id`
        u innego merchanta to niezależna transakcja.

        **Punkty** — `kwota × przelicznik` obowiązujący w chwili `performed_at`,
        zaokrąglenie w dół. Odpowiedź zawiera zastosowany przelicznik.

        **Kupony** — wynik per kupon w `coupons[]`:
        - wszystkie wskazane kupony dostępne → wszystkie skonsumowane atomowo;
        - przy wielu kuponach, jeśli którykolwiek niedostępny → **żaden** nie jest
          konsumowany, a odpowiedź wskazuje blokujący kupon;
        - kupon dezaktywowany / już wykorzystany (wyścig) → transakcja i punkty
          przechodzą, kupon nieskonsumowany, ostrzeżenie w `warnings[]`
          ("rabat udzielony poza programem");
        - kupon innego członka → transakcja rejestrowana bez kuponu,
          `mismatch` w wyniku kuponu.

        Transakcja zsynchronizowana z opóźnieniem dostaje `delayed_sync: true`,
        a w historii widnieje czas wykonania (`performed_at`), nie synchronizacji.
        Transakcja wykonana przed zawieszeniem programu lub blokadą członka,
        zsynchronizowana po — jest przyjmowana według stanu z `performed_at`.
      security:
        - programKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTransactionRequest'
      responses:
        '201':
          description: Transakcja zarejestrowana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterTransactionResponse'
        '200':
          description: 'Powtórzenie — zwrócony wynik pierwotnej rejestracji (`idempotent_replay: true`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterTransactionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProgramKey'
        '403':
          description: Członkostwo zablokowane przez merchanta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: membership_blocked, message: "Członkostwo jest nieaktywne." }
        '404':
          description: Karta spoza programu (synchronizacja offline) — wpis odrzucony, widoczny w panelu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: card_foreign_program, message: "Karta spoza tego programu." }
        '409':
          description: Konflikt kontekstu lub stanu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                scan_expired:
                  value: { error: { code: scan_context_expired, message: "Kontekst skanu wygasł. Zeskanuj kartę ponownie." } }
                program_suspended:
                  value: { error: { code: program_not_active, message: "Program jest zawieszony." } }
                idempotency_conflict:
                  value: { error: { code: idempotency_conflict, message: "Transakcja o tym identyfikatorze została już zarejestrowana z innymi danymi." } }
        '422':
          description: Błąd walidacji (kwota ≤ 0, brak transaction_id, brak identyfikacji członka, kupony offline)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                amount:
                  value: { error: { code: validation_failed, message: "Kwota musi być większa od zera.", fields: [{ field: amount, message: "kwota musi być większa od zera" }] } }
                no_member:
                  value: { error: { code: member_not_identified, message: "Brak zidentyfikowanego członka — zeskanuj kartę." } }

  /sdk/transactions/{transactionId}/cancellation:
    post:
      tags: [SDK]
      operationId: sdkCancelTransaction
      summary: Anulowanie naliczenia (zwrot na SoftPOS)
      description: |
        Cofa punkty naliczone transakcją o podanym `transaction_id` (identyfikator
        SoftPOS, zakres merchanta). Operacja idempotentna — powtórne anulowanie
        zwraca 200 z `already_cancelled: true`, punkty nie schodzą drugi raz.

        Saldo nigdy nie spada poniżej zera — brakująca różnica jest odnotowana
        w historii jako korekta (`correction`). Kupon skonsumowany w anulowanej
        transakcji wraca do puli klienta, o ile jego oferta jest nadal aktywna.
        Zwrot częściowy poza v1 — anulowana jest zawsze cała transakcja.
      security:
        - programKey: []
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Identyfikator transakcji nadany przez SoftPOS
          schema:
            type: string
      responses:
        '200':
          description: Naliczenie anulowane (lub już wcześniej anulowane)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelTransactionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedProgramKey'
        '404':
          description: Transakcja nieznana — żadne saldo nie jest modyfikowane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: transaction_unknown, message: "Transakcja nieznana." }

  # ==================================================================
  # PANEL — panel merchanta (JWT Supabase)
  # ==================================================================

  /panel/merchant:
    get:
      tags: [Panel]
      operationId: getMerchant
      summary: Profil zalogowanego merchanta
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Profil merchanta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Panel]
      operationId: updateMerchant
      summary: Aktualizacja profilu (nazwa firmy, kontaktowy e-mail)
      description: |
        Kontaktowy e-mail jest wymagany m.in. przy logowaniu Apple z ukrytym
        adresem (relay) — powiadomienia idą na adres kontaktowy po jego ustawieniu.
      security:
        - supabaseJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                  maxLength: 120
                contact_email:
                  type: string
                  format: email
      responses:
        '200':
          description: Zaktualizowany profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /panel/program:
    get:
      tags: [Panel]
      operationId: getProgram
      summary: Konfiguracja programu merchanta
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Program merchanta (jeden na merchanta w v1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Panel]
      operationId: updateProgram
      summary: Aktualizacja brandingu i przelicznika punktów
      description: |
        Zmiana brandingu po wydaniu kart uruchamia propagację na wszystkie wydane
        karty (status w `branding_propagation`); punkty i oferty pozostają nietknięte.
        Przelicznik `points_per_pln` musi być > 0; zmiana działa wyłącznie dla
        transakcji wykonanych po zmianie (bez przeliczania wstecz).
        Zbyt niski kontrast kolorów zwraca ostrzeżenie w odpowiedzi
        (`warnings[]`), ale zapis przechodzi.
      security:
        - supabaseJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramUpdate'
      responses:
        '200':
          description: Zapisano; ewentualne ostrzeżenia w `warnings[]`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Program'
                  - type: object
                    properties:
                      warnings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Warning'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /panel/program/logo:
    post:
      tags: [Panel]
      operationId: uploadLogo
      summary: Wgranie logo programu
      description: Dozwolone formaty PNG/JPEG/SVG, maks. 2 MB. Błędny plik nie nadpisuje poprzedniego logo.
      security:
        - supabaseJwt: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo zapisane
          content:
            application/json:
              schema:
                type: object
                properties:
                  logo_url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Plik za duży
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Nieobsługiwany format pliku
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /panel/program/publish:
    post:
      tags: [Panel]
      operationId: publishProgram
      summary: Publikacja programu
      description: |
        Wymaga kompletu brandingu (nazwa wyświetlana, logo) i przelicznika.
        Braki → 422 z listą brakujących pól, program pozostaje nieopublikowany,
        link zapraszający nie działa.

        Publikacja tworzy po stronie wystawcy kart (PassKit) program, tier
        i szablon karty z brandingiem merchanta (pole salda punktów, sekcja
        ofert); zwrócone identyfikatory PassKit backend zapisuje przy programie
        i używa ich potem do wydawania kart, aktualizacji sald i propagacji
        brandingu. Awaria wystawcy podczas publikacji → 502, program pozostaje
        w statusie `draft`, publikację można ponowić bez skutków ubocznych
        (operacja idempotentna). Po udanej publikacji dostępny jest statyczny
        link zapraszający, QR oraz klucz programu.
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Program opublikowany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Program w stanie, z którego publikacja jest niedozwolona (`suspended`
            lub `closed` — publikacja działa wyłącznie z `draft`; z `published`
            jest idempotentna i zwraca 200)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: invalid_state_transition, message: "Nie można wykonać tej operacji: program jest w stanie suspended." }
        '422':
          description: Brak kompletu konfiguracji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error:
                  code: validation_failed
                  message: "Uzupełnij konfigurację przed publikacją."
                  fields:
                    - { field: display_name, message: "nazwa wyświetlana jest wymagana" }
                    - { field: logo_url, message: "logo jest wymagane" }
        '502':
          description: |
            Awaria wystawcy kart przy tworzeniu programu/szablonu —
            program pozostaje w statusie `draft`, ponów publikację
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: pass_provider_error, message: "Wystawca kart chwilowo niedostępny. Spróbuj ponownie za chwilę." }

  /panel/program/suspend:
    post:
      tags: [Panel]
      operationId: suspendProgram
      summary: Zawieszenie programu
      description: |
        Link zapraszający przestaje przyjmować nowych klientów; skan i rejestracja
        transakcji są odrzucane. Karty pozostają w portfelach z zachowanym saldem.
        Transakcje z kolejki offline wykonane przed zawieszeniem są nadal przyjmowane.

        Dozwolone wyłącznie ze stanu `published` — inaczej `409
        invalid_state_transition`. Maszyna stanów programu: `publish` działa
        tylko z `draft` (z `published` jest idempotentny), `resume` tylko
        z `suspended`, `close` z `published` lub `suspended`. Ze stanu `closed`
        nie ma powrotu — żadna operacja nie wskrzesza zamkniętego programu.
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Program zawieszony
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Program nie jest w stanie `published` — zawieszenie dozwolone tylko z tego stanu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: invalid_state_transition, message: "Nie można wykonać tej operacji: program jest w stanie draft." }

  /panel/program/resume:
    post:
      tags: [Panel]
      operationId: resumeProgram
      summary: Wznowienie zawieszonego programu
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Program wznowiony
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Program nie jest w stanie `suspended` — wznowienie dozwolone tylko z tego stanu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: invalid_state_transition, message: "Nie można wykonać tej operacji: program jest w stanie published." }

  /panel/program/close:
    post:
      tags: [Panel]
      operationId: closeProgram
      summary: Zamknięcie programu (nieodwracalne jednym kliknięciem)
      description: |
        Wymaga potwierdzenia (`confirm: true`). Link zapraszający i skanowanie
        przestają działać; historia transakcji pozostaje dostępna w panelu.
        Odpowiedź przed potwierdzeniem (`confirm` pominięte/false) zwraca 409
        z liczbą klientów, którzy stracą dostęp do punktów.
      security:
        - supabaseJwt: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Program zamknięty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '409':
          description: Wymagane potwierdzenie — zwraca skutki zamknięcia
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    $ref: '#/components/schemas/ErrorBody'
                  affected_members:
                    type: integer
                    description: Liczba klientów, którzy stracą dostęp do zebranych punktów
              example:
                error: { code: confirmation_required, message: "Potwierdź zamknięcie programu." }
                affected_members: 40
        '401':
          $ref: '#/components/responses/Unauthorized'

  /panel/program/key:
    get:
      tags: [Panel]
      operationId: getProgramKey
      summary: Klucz programu do konfiguracji SoftPOS
      description: |
        Dostępny dopiero po publikacji programu (wcześniej 409). Zwraca klucz
        oraz datę ostatniego użycia.
      security:
        - supabaseJwt: []
      responses:
        '200':
          description: Klucz programu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Program nieopublikowany — klucz będzie dostępny po publikacji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: program_not_published, message: "Klucz zostanie udostępniony po publikacji programu." }
    post:
      tags: [Panel]
      operationId: rotateProgramKey
      summary: Wymiana (rotacja) klucza programu
      description: |
        Generuje nowy klucz; stary przestaje działać **natychmiast** — operacje
        SoftPOS ze starym kluczem są odrzucane (401). Transakcje, punkty i oferty
        pozostają nienaruszone. SoftPOS wymaga rekonfiguracji nowym kluczem.
      security:
        - supabaseJwt: []
      responses:
        '201':
          description: Nowy klucz wygenerowany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Program nieopublikowany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /panel/members:
    get:
      tags: [Panel]
      operationId: listMembers
      summary: Lista klientów lojalnościowych
      description: |
        Imię, nazwisko, e-mail, saldo punktów, data ostatniej transakcji.
        Wyszukiwanie po nazwisku lub adresie e-mail. Dane wyłącznie z programu
        zalogowanego merchanta (izolacja RLS) — cudze rekordy niewidoczne,
        bezpośrednie odpytanie cudzego identyfikatora zwraca 404 i trafia do
        logu bezpieczeństwa.
      security:
        - supabaseJwt: []
      parameters:
        - name: search
          in: query
          description: Fragment nazwiska lub adresu e-mail
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Strona listy członków
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /panel/members/{memberId}:
    get:
      tags: [Panel]
      operationId: getMember
      summary: Szczegóły członka
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Członek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Nie znaleziono — także dla rekordów innych merchantów (próba logowana)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /panel/members/{memberId}/block:
    post:
      tags: [Panel]
      operationId: blockMember
      summary: Blokada członkostwa
      description: |
        Skan karty zablokowanego członka zwraca status nieaktywnego członkostwa;
        rejestracja transakcji i konsumpcja kuponów odrzucane. Punkty i historia
        pozostają widoczne w panelu. Transakcja offline wykonana przed blokadą
        jest po synchronizacji przyjmowana.
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Członkostwo zablokowane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /panel/members/{memberId}/unblock:
    post:
      tags: [Panel]
      operationId: unblockMember
      summary: Odblokowanie członkostwa
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Członkostwo aktywne
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /panel/offers:
    get:
      tags: [Panel]
      operationId: listOffers
      summary: Lista ofert programu
      security:
        - supabaseJwt: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: Oferty
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Panel]
      operationId: createOffer
      summary: Utworzenie kuponu jednorazowego
      description: |
        Oferta jest natychmiast dostępna dla **wszystkich** członków programu
        (także tych, którzy dołączyli przed jej utworzeniem); każdy może ją
        zrealizować dokładnie raz. Bez dat ważności i progów kwotowych w v1.
        Tytuł ograniczony limitem znaków karty Wallet.
      security:
        - supabaseJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreate'
      responses:
        '201':
          description: Oferta utworzona i aktywna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Program nieopublikowany
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /panel/offers/{offerId}/deactivate:
    post:
      tags: [Panel]
      operationId: deactivateOffer
      summary: Dezaktywacja oferty
      description: |
        Oferta znika z listy dostępnych przy skanowaniu; zrealizowane kupony
        pozostają w historii; niezrealizowani członkowie tracą dostęp.
        Dezaktywacja nie blokuje transakcji w toku — kupon po prostu nie jest
        konsumowany (ostrzeżenie po stronie SDK).
      security:
        - supabaseJwt: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Oferta nieaktywna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /panel/transactions:
    get:
      tags: [Panel]
      operationId: listTransactions
      summary: Historia transakcji
      description: |
        Data (czas wykonania na kasie), klient, kwota, naliczone punkty,
        identyfikator transakcji, zastosowany przelicznik, powiązane realizacje
        kuponów, status (`registered` / `cancelled`), znacznik opóźnionej
        synchronizacji.
      security:
        - supabaseJwt: []
      parameters:
        - name: member_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [registered, cancelled]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Strona historii
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /panel/sync-rejections:
    get:
      tags: [Panel]
      operationId: listSyncRejections
      summary: Odrzucone synchronizacje offline
      description: |
        Wpisy odrzucone przy synchronizacji kolejki offline SDK wraz z powodem —
        m.in. karta spoza programu, wpisy odrzucone z przepełnionej lub
        przeterminowanej kolejki (limit 500 wpisów / 7 dni).
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Odrzucone wpisy
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRejection'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================================================================
  # OPERATOR — utrzymanie platformy
  # ==================================================================

  /ops/pass-discrepancies:
    get:
      tags: [Operator]
      operationId: listPassDiscrepancies
      summary: Raport rozbieżności kart z backendem
      description: |
        Członkostwa, których karta u wystawcy nie zsynchronizowała się mimo
        ponowień. Rozbieżność nigdy nie powoduje utraty punktów — backend jest
        źródłem prawdy.
      security:
        - operatorAuth: []
      responses:
        '200':
          description: Lista rozbieżności
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PassDiscrepancy'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ops/memberships/{membershipId}/reissue-pass:
    post:
      tags: [Operator]
      operationId: reissuePass
      summary: Wymuszenie ponownego wystawienia karty
      description: Bez utraty salda ani historii ofert.
      security:
        - operatorAuth: []
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Zlecenie ponownego wystawienia przyjęte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /ops/memberships/{membershipId}/erasure:
    post:
      tags: [Operator]
      operationId: eraseMembership
      summary: Żądanie usunięcia danych klienta (RODO)
      description: |
        Członkostwo zostaje usunięte lub zanonimizowane; karta przestaje być
        aktualizowana; zagregowana historia transakcji merchanta pozostaje spójna.
      security:
        - operatorAuth: []
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Żądanie przyjęte do realizacji
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT z Supabase Auth. Logowanie passwordless (magic link + OTP e-mail)
        oraz Apple/Google realizuje Supabase Auth — poza zakresem tej specyfikacji.
        Rejestracja = logowanie; konto merchanta powstaje przy pierwszym
        uwierzytelnieniu. RLS gwarantuje widoczność wyłącznie własnego programu.
    programKey:
      type: apiKey
      in: header
      name: X-Program-Key
      description: |
        Klucz programu merchanta pobrany z panelu (zakładka Integracja).
        Unieważniony klucz → 401 na każdej operacji; operacja nie trafia do
        kolejki offline SDK.
    operatorAuth:
      type: http
      scheme: bearer
      description: Uwierzytelnienie operatora platformy (rola service/admin).

  parameters:
    InviteCode:
      name: inviteCode
      in: path
      required: true
      description: Statyczny kod zaproszenia programu (z QR merchanta)
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    NotFound:
      description: Zasób nie istnieje
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: not_found, message: "Nie znaleziono zasobu." }
    Unauthorized:
      description: Brak lub nieważny token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: unauthorized, message: "Zaloguj się ponownie." }
    UnauthorizedProgramKey:
      description: Nieważny lub cofnięty klucz programu — żadne dane nie są zwracane
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: invalid_program_key, message: "Klucz programu jest nieważny. Skonfiguruj SoftPOS nowym kluczem z panelu." }
    ProgramNotActive:
      description: Program nieopublikowany, zawieszony lub zamknięty
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: program_not_active, message: "Program nie jest aktywny." }
    RateLimited:
      description: |
        Przekroczony limit żądań.

        **Niezmiennik anty-enumeracyjny:** na powierzchni publicznej ten status
        nie może NIGDY zależeć od tego, czy podany adres ma członkostwo —
        limiter oparty na członkostwie sam w sobie odpowiada na pytanie „czy
        ten adres należy do programu" (dwa żądania wystarczą). Limit wysyłki
        e-maili jest kluczowany hashem (program + adres) i po jego przekroczeniu
        odpowiedź pozostaje `202` z komunikatem „być może" — wiadomość po prostu
        nie wychodzi. `429` wolno zwracać wyłącznie z przyczyn niezależnych od
        członkostwa (np. limit per IP).
      headers:
        Retry-After:
          description: Sekundy do odblokowania
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: rate_limited, message: "Odczekaj chwilę przed kolejną próbą." }
    ValidationFailed:
      description: Błąd walidacji
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  schemas:
    # ----------------------------------------------------------------
    # Wspólne
    # ----------------------------------------------------------------
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stabilny kod błędu do obsługi programistycznej
          example: validation_failed
        message:
          type: string
          description: Komunikat do wyświetlenia (PL)
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ValidationError:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: object
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    required: [field, message]
                    properties:
                      field:
                        type: string
                      message:
                        type: string
    Warning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: low_contrast
        message:
          type: string
          example: "Kolory karty mają niski kontrast — karta może być nieczytelna."
    Money:
      type: string
      description: Kwota w PLN jako string dziesiętny z dwoma miejscami, > 0
      pattern: '^\d+\.\d{2}$'
      example: "250.00"
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    # ----------------------------------------------------------------
    # Public
    # ----------------------------------------------------------------
    PublicProgram:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, unpublished, suspended, closed]
          description: |
            `unpublished` / `suspended` → "program chwilowo niedostępny";
            `closed` → "program został zakończony". Poza `active` strona nie
            zbiera danych osobowych.
        display_name:
          type: string
          example: "Salon Le Perle"
        logo_url:
          type: string
          format: uri
        background_color:
          type: string
          example: "#1A1A2E"
        description:
          type: string
    JoinRequest:
      type: object
      required: [first_name, last_name, email, consent]
      properties:
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        consent:
          type: boolean
          description: Zgoda RODO na przetwarzanie danych — musi być `true`, inaczej 422 i karta nie jest wydawana
    JoinResponse:
      type: object
      description: Zwracane wyłącznie dla nowo utworzonego członkostwa (201)
      required: [membership_id, pass]
      properties:
        membership_id:
          type: string
          format: uuid
        pass:
          $ref: '#/components/schemas/PassLinks'
    MaybeEmailResponse:
      type: object
      description: |
        Niezobowiązujący komunikat „być może" — nie potwierdza ani nie zaprzecza
        istnieniu członkostwa dla podanego adresu. Bez identyfikatorów i salda.
      required: [message]
      properties:
        message:
          type: string
          example: "Jeżeli ten adres należy do programu u tego merchanta, karta pojawi się w Twojej skrzynce e-mail."
    PassLinks:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, preparing]
          description: |
            `preparing` — wystawca kart nie odpowiedział; członkostwo istnieje,
            link do karty zostanie wysłany e-mailem po udanym wydaniu.
        apple_wallet_url:
          type: string
          format: uri
          nullable: true
          description: Link do pliku `.pkpass` — cel przycisku "Dodaj do Apple Wallet" na landing page'u programu
        google_wallet_url:
          type: string
          format: uri
          nullable: true
          description: Link "Save to Google Wallet" — cel przycisku "Dodaj do Google Wallet"

    # ----------------------------------------------------------------
    # SDK
    # ----------------------------------------------------------------
    SdkProgram:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [published, unpublished, suspended, closed]
        display_name:
          type: string
        invite_url:
          type: string
          format: uri
          nullable: true
          description: |
            Statyczny link zaproszenia do renderowania jako QR — prowadzi do
            dedykowanego landing page'a programu w aplikacji panelu merchanta;
            `null` poza statusem `published`
        points_per_pln:
          type: number
          format: double
          description: Aktualny przelicznik punktów (informacyjnie)
    ScanResult:
      type: object
      required: [scan_token, expires_at, member, offers]
      properties:
        scan_token:
          type: string
          description: Kontekst skanu do rejestracji transakcji online; ważny 10 minut
        expires_at:
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/ScanMember'
        offers:
          type: array
          description: Dostępne (niezrealizowane, aktywne) kupony członka; pusta lista dla członka zablokowanego
          items:
            $ref: '#/components/schemas/SdkOffer'
    ScanMember:
      type: object
      required: [membership_id, first_name, last_name, points_balance, status]
      properties:
        membership_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        points_balance:
          type: integer
        status:
          type: string
          enum: [active, blocked]
          description: '`blocked` — rejestracja transakcji i konsumpcja kuponów zostaną odrzucone'
    SdkOffer:
      type: object
      required: [coupon_id, title]
      properties:
        coupon_id:
          type: string
          format: uuid
          description: Identyfikator kuponu tego członka — przekazywany w `coupon_ids` rejestracji transakcji
        title:
          type: string
          example: "Rabat 25% na strzyżenie"
        description:
          type: string
          nullable: true
    RegisterTransactionRequest:
      type: object
      required: [transaction_id, amount]
      properties:
        transaction_id:
          type: string
          minLength: 1
          description: Identyfikator nadany przez SoftPOS — klucz idempotencji w zakresie merchanta
          example: "TX-1001"
        amount:
          $ref: '#/components/schemas/Money'
        scan_token:
          type: string
          nullable: true
          description: Kontekst skanu (ścieżka online). Dokładnie jedno z `scan_token` / `card_token`.
        card_token:
          type: string
          nullable: true
          description: |
            Identyfikator członkostwa z QR karty, odczytany lokalnie przez SDK
            (synchronizacja offline) — ten sam, który online idzie do
            `POST /sdk/scans`; wymaga `performed_at`
        performed_at:
          type: string
          format: date-time
          nullable: true
          description: Czas wykonania transakcji na kasie; wymagany dla synchronizacji offline, domyślnie chwila żądania
        coupon_ids:
          type: array
          nullable: true
          description: Kupony do atomowej konsumpcji; niedozwolone w ścieżce offline
          items:
            type: string
            format: uuid
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Dane opisowe SoftPOS — trafiają do historii, nie wpływają na punkty ani kupony
    RegisterTransactionResponse:
      type: object
      required: [id, transaction_id, points_awarded, points_balance, coupons, idempotent_replay]
      properties:
        id:
          type: string
          format: uuid
          description: Wewnętrzny identyfikator transakcji LoyaltyGo
        transaction_id:
          type: string
          description: Identyfikator SoftPOS z żądania
        points_awarded:
          type: integer
          description: Punkty naliczone tą transakcją (zaokrąglone w dół)
        points_balance:
          type: integer
          description: Saldo członka po operacji
        points_rate_used:
          type: number
          format: double
          description: Przelicznik zastosowany do naliczenia (z chwili wykonania transakcji)
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/CouponResult'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: |
            Np. `coupon_inactive` ("kupon nieaktywny — rabat udzielony poza
            programem"), `coupon_already_used` (wyścig dwóch urządzeń).
        idempotent_replay:
          type: boolean
          description: '`true` gdy zwrócono wynik pierwotnej rejestracji'
        delayed_sync:
          type: boolean
          description: '`true` gdy transakcja zsynchronizowana z opóźnieniem (offline)'
    CouponResult:
      type: object
      required: [coupon_id, status]
      properties:
        coupon_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [consumed, inactive, already_used, member_mismatch, blocked_by_other]
          description: |
            `consumed` — kupon zrealizowany w tej transakcji;
            `inactive` — oferta dezaktywowana przed rejestracją, kupon nieskonsumowany;
            `already_used` — kupon wykorzystany równolegle gdzie indziej;
            `member_mismatch` — kupon należy do innego członka;
            `blocked_by_other` — kupon dostępny, ale nieskonsumowany, bo inny kupon
            z żądania był niedostępny (zasada „wszystko albo nic" dla wielu kuponów).
    CancelTransactionResponse:
      type: object
      required: [id, transaction_id, status, points_reverted, points_balance, already_cancelled]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
        status:
          type: string
          enum: [cancelled]
        points_reverted:
          type: integer
          description: Punkty faktycznie odjęte (saldo nie schodzi poniżej zera)
        correction:
          type: integer
          description: Różnica odnotowana jako korekta, gdy saldo nie pokryło pełnego cofnięcia
        points_balance:
          type: integer
        coupons_restored:
          type: array
          description: Kupony przywrócone do puli klienta (tylko z aktywnych ofert)
          items:
            type: string
            format: uuid
        already_cancelled:
          type: boolean
          description: '`true` przy powtórnym anulowaniu — operacja zignorowana'

    # ----------------------------------------------------------------
    # Panel
    # ----------------------------------------------------------------
    Merchant:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Adres z uwierzytelnienia (może być relay Apple)
        contact_email:
          type: string
          format: email
          nullable: true
          description: Kontaktowy adres firmy — wymagany przy ukrytym adresie Apple
        company_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Program:
      type: object
      required: [id, status, points_per_pln]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, published, suspended, closed]
        display_name:
          type: string
          nullable: true
        logo_url:
          type: string
          format: uri
          nullable: true
        background_color:
          type: string
          nullable: true
          example: "#1A1A2E"
        description:
          type: string
          nullable: true
        points_per_pln:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Punkty za 1 zł (np. 0.1 = 10 pkt za 100 zł); > 0; zmiana nie działa wstecz
          example: 0.1
        invite_url:
          type: string
          format: uri
          nullable: true
          description: |
            Statyczny link zapraszający — dedykowany landing page programu
            w aplikacji panelu merchanta (np. `https://app.loyaltygo.pl/{inviteCode}`);
            dostępny po publikacji
          example: "https://app.loyaltygo.pl/8fK3xQ"
        invite_qr_url:
          type: string
          format: uri
          nullable: true
          description: Gotowy do pobrania i wydruku obraz QR zaproszenia
        branding_propagation:
          type: object
          nullable: true
          description: Status propagacji zmiany brandingu na wydane karty
          properties:
            status:
              type: string
              enum: [pending, in_progress, completed, failed]
            updated_cards:
              type: integer
            total_cards:
              type: integer
    ProgramUpdate:
      type: object
      description: Wszystkie pola opcjonalne — aktualizacja częściowa
      properties:
        display_name:
          type: string
          maxLength: 60
        background_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        description:
          type: string
          maxLength: 300
        points_per_pln:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
    ProgramKey:
      type: object
      required: [program_key]
      properties:
        program_key:
          type: string
          description: Klucz do konfiguracji SDK w aplikacji SoftPOS
          example: "lgo_pk_live_9f2c..."
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Data ostatniego użycia klucza przez SoftPOS
    Member:
      type: object
      required: [id, first_name, last_name, email, points_balance, status]
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        points_balance:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [active, blocked]
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
        joined_at:
          type: string
          format: date-time
    Offer:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        redemptions_count:
          type: integer
          description: Liczba zrealizowanych kuponów tej oferty
        created_at:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
          nullable: true
    OfferCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
          description: Limit wynikający z miejsca na karcie Wallet
          example: "Rabat 25% na strzyżenie"
        description:
          type: string
          maxLength: 200
          nullable: true
    Transaction:
      type: object
      required: [id, transaction_id, member_id, amount, points_awarded, status, performed_at]
      properties:
        id:
          type: string
          format: uuid
          description: Wewnętrzny identyfikator LoyaltyGo
        transaction_id:
          type: string
          description: Identyfikator SoftPOS
        member_id:
          type: string
          format: uuid
        member_name:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        points_awarded:
          type: integer
        points_rate_used:
          type: number
          format: double
          description: Przelicznik zastosowany przy naliczeniu (widoczny w historii)
        status:
          type: string
          enum: [registered, cancelled]
        points_reverted:
          type: integer
          nullable: true
          description: Punkty cofnięte przy anulowaniu (wpis nie znika z historii)
        coupon_redemptions:
          type: array
          description: Realizacje kuponów powiązane z transakcją (w tym wycofane przy zwrocie)
          items:
            type: object
            properties:
              coupon_id:
                type: string
                format: uuid
              offer_title:
                type: string
              status:
                type: string
                enum: [redeemed, reverted]
        performed_at:
          type: string
          format: date-time
          description: Czas wykonania na kasie (nie czas synchronizacji)
        synced_at:
          type: string
          format: date-time
        delayed_sync:
          type: boolean
          description: '`true` — zsynchronizowana z opóźnieniem (offline)'
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    SyncRejection:
      type: object
      required: [rejected_at, reason]
      properties:
        transaction_id:
          type: string
          nullable: true
          description: Identyfikator SoftPOS odrzuconego wpisu (jeśli znany)
        performed_at:
          type: string
          format: date-time
          nullable: true
        rejected_at:
          type: string
          format: date-time
        reason:
          type: string
          enum: [card_foreign_program, queue_overflow, entry_expired]
          description: |
            `card_foreign_program` — transakcja offline dla karty innego merchanta;
            `queue_overflow` — kolejka przekroczyła 500 wpisów;
            `entry_expired` — wpis starszy niż 7 dni.
        message:
          type: string

    # ----------------------------------------------------------------
    # Operator
    # ----------------------------------------------------------------
    PassDiscrepancy:
      type: object
      required: [membership_id, program_id, detected_at]
      properties:
        membership_id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        detected_at:
          type: string
          format: date-time
        last_retry_at:
          type: string
          format: date-time
          nullable: true
        backend_balance:
          type: integer
          description: Saldo w backendzie (źródło prawdy)
        details:
          type: string
